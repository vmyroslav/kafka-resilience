version: '3'

vars:
  SUBMODULES: >-
    adapter/sarama
    examples/sarama/basic
    examples/sarama/granular
    examples/sarama/strict
    examples/sarama/demo

includes:
  internal:
    taskfile: ./Taskfile.internal.yml
    internal: true

tasks:
  default:
    desc: Show all available tasks
    cmds:
      - task --list-all

# #################################################
# Testing Tasks
# #################################################
  test-unit:
    desc: Run unit tests (fast, no Docker required)
    cmds:
      - task: internal:test:resilience
      - task: internal:test:adapter

  test-integration:
    desc: Run integration tests (requires Docker)
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is not running. Please start Docker daemon before running integration tests."
    cmds:
      - task: internal:test:integration

  test:
    desc: Run all tests (unit + integration)
    cmds:
      - task: test-unit
      - task: test-integration

  test-coverage:
    desc: Run all tests with coverage reports
    cmds:
      - task: internal:test:resilience
        vars: { COVERAGE: "true" }
      - task: internal:test:adapter
        vars: { COVERAGE: "true" }
      - task: internal:test:integration
        vars: { COVERAGE: "true" }

# #################################################
# Code Quality Tasks
# #################################################
  lint:
    desc: Run linter checks
    cmds:
      - golangci-lint run -c .golangci.yml

  fmt:
    desc: Format project files
    cmds:
      - find . -name '*.go' -type f -exec gofumpt -w {} +
      - golangci-lint run --fix

  clean:
    desc: Clean up and format code
    cmds:
      - go mod tidy
      - for: { var: SUBMODULES, split: ' ' }
        cmd: cd {{.ITEM}} && go mod tidy
      - defer: {task: fmt}

  update-deps:
    desc: Update Go dependencies
    cmds:
      - go get -u ./...
      - go mod tidy
      - for: { var: SUBMODULES, split: ' ' }
        cmd: cd {{.ITEM}} && go get -u ./... && go mod tidy

# #################################################
# Build Tasks
# #################################################
  build-example:
    desc: Build example applications
    vars:
      BUILD_DIR: '{{.BUILD_DIR | default "dist"}}'
      EXAMPLES: basic granular strict demo
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - for: { var: EXAMPLES, split: ' ' }
        cmd: cd examples/sarama/{{.ITEM}} && CGO_ENABLED=0 go build -o ../../../{{.BUILD_DIR}}/{{.ITEM}} .
